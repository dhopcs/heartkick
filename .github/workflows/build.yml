name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-name: heartkick-linux
            artifact-path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: heartkick-windows
            artifact-path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-name: heartkick-macos
            artifact-path: src-tauri/target/aarch64-apple-darwin/release/bundle

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install

      - name: Build
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: 29.0.13846066
      ANDROID_BUILD_TOOLS_VERSION: 35.0.0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build-tools
        run: |
          sdkmanager \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}"

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install

      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: pnpm tauri android build

      - name: Sign APK
        env:
          BUILD_TOOLS: ${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          APK_UNSIGNED: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          APK_ALIGNED: aligned.apk
          APK_SIGNED: heartkick-universal-${{ github.ref_name }}.apk
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/heartkick.jks
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_UNSIGNED" "$APK_ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/heartkick.jks \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out "$APK_SIGNED" "$APK_ALIGNED"
          rm -f /tmp/heartkick.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heartkick-android
          path: heartkick-universal-${{ github.ref_name }}.apk
          if-no-files-found: error

  release:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/heartkick-linux/**/*.AppImage
            artifacts/heartkick-linux/**/*.deb
            artifacts/heartkick-windows/**/*.exe
            artifacts/heartkick-windows/**/*.msi
            artifacts/heartkick-macos/**/*.dmg
            artifacts/heartkick-android/heartkick-*.apk

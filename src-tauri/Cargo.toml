[package]
name = "heartkick"
version = "1.0.0"
description = "Cross platform and extensible Heart Rate Monitor + Integrations"
authors = ["heartkick contributors"]
edition = "2021"

[lib]
name = "heartkick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "heartkick"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-blec = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time", "macros", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }

clap = { version = "4", features = ["derive"] }

anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

directories = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1" }
parking_lot = "0.12"

axum = { version = "0.8" }
tower-http = { version = "0.6", features = ["cors"] }

rosc = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
btleplug = "0.12"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
